<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600;700&display=swap">
<style>
:root {
  --bg:        #07070f;
  --surface:   #0d0d1a;
  --panel:     #0f0f20cc;
  --border:    #1e1e3a;
  --core:      #ff8c00;
  --gold:      #ffd700;
  --amber:     #ffb347;
  --glow-a:    #ff8c0088;
  --glow-b:    #ffd70044;
  --txt:       #e8e0d0;
  --txt-muted: #6a6a88;
  --user-msg:  #1a1a30;
  --jarvis-msg:#0f1a0f;
  --accent-g:  #00ff88;
}

*,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  background: var(--bg);
  color: var(--txt);
  font-family: 'Rajdhani', sans-serif;
  overflow: hidden;
  user-select: none;
}

/* ─── Layout ─────────────────────────────── */
.shell {
  display: grid;
  grid-template-columns: 1fr 320px;
  grid-template-rows: 48px 1fr 80px;
  grid-template-areas:
    "topbar topbar"
    "stage  chat"
    "controls controls";
  height: 100dvh;
  gap: 0;
}
@media (max-width: 700px) {
  .shell {
    grid-template-columns: 1fr;
    grid-template-rows: 48px 1fr auto 80px;
    grid-template-areas:
      "topbar"
      "stage"
      "chat"
      "controls";
  }
  #chat-panel { max-height: 220px; }
}

/* ─── Top bar ─────────────────────────────── */
.topbar {
  grid-area: topbar;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-inline: 24px;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
}
.topbar-title {
  font-family: 'Orbitron', sans-serif;
  font-size: 1rem;
  font-weight: 900;
  letter-spacing: 0.3em;
  color: var(--core);
  text-shadow: 0 0 12px var(--glow-a);
}
.topbar-right {
  display: flex;
  align-items: center;
  gap: 20px;
  font-size: 0.75rem;
  color: var(--txt-muted);
  letter-spacing: 0.1em;
  font-weight: 600;
}
.status-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--txt-muted);
  transition: background 0.4s, box-shadow 0.4s;
}
.status-dot.active { background: var(--accent-g); box-shadow: 0 0 8px var(--accent-g); }
.status-dot.thinking { background: var(--gold); box-shadow: 0 0 8px var(--gold); animation: blink 0.8s ease-in-out infinite; }
.status-dot.speaking { background: var(--core); box-shadow: 0 0 8px var(--glow-a); animation: blink 0.5s ease-in-out infinite; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

#status-label { min-width: 90px; text-align: right; }
#clock { font-family: 'Orbitron', sans-serif; font-size: 0.7rem; }

/* ─── Stage (core orb area) ──────────────── */
.stage {
  grid-area: stage;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
}

/* ambient grid */
.stage::before {
  content: '';
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(var(--border) 1px, transparent 1px),
    linear-gradient(90deg, var(--border) 1px, transparent 1px);
  background-size: 48px 48px;
  opacity: 0.3;
  mask-image: radial-gradient(ellipse 60% 60% at 50% 50%, black 30%, transparent 100%);
}

/* ─── Orb system ─────────────────────────── */
.orb-system {
  position: relative;
  width: min(380px, 80vw);
  aspect-ratio: 1;
  display: flex;
  align-items: center;
  justify-content: center;
}

.ring {
  position: absolute;
  border-radius: 50%;
  border: 2px solid transparent;
}

.ring-outer {
  inset: 0;
  border-top-color: var(--core);
  border-right-color: var(--glow-a);
  border-bottom-color: transparent;
  border-left-color: transparent;
  animation: spin 10s linear infinite;
  filter: drop-shadow(0 0 6px var(--core));
}
.ring-mid {
  inset: 12%;
  border-top-color: transparent;
  border-right-color: transparent;
  border-bottom-color: var(--gold);
  border-left-color: var(--glow-b);
  animation: spin 6s linear infinite reverse;
  filter: drop-shadow(0 0 5px var(--gold));
}
.ring-inner {
  inset: 24%;
  border-top-color: var(--amber);
  border-right-color: transparent;
  border-bottom-color: transparent;
  border-left-color: var(--amber);
  animation: spin 3.5s linear infinite;
  filter: drop-shadow(0 0 4px var(--amber));
}

/* tick marks on outer ring */
.ring-outer::before, .ring-outer::after {
  content: '';
  position: absolute;
  width: 4px; height: 4px;
  border-radius: 50%;
  background: var(--core);
  box-shadow: 0 0 8px var(--core);
  top: 4px; left: 50%;
  transform: translateX(-50%);
}
.ring-outer::after {
  top: auto; bottom: 4px;
  background: var(--gold);
  box-shadow: 0 0 8px var(--gold);
}

@keyframes spin { to { transform: rotate(360deg); } }

/* core orb */
.orb-core {
  width: 46%;
  aspect-ratio: 1;
  border-radius: 50%;
  background: radial-gradient(circle at 38% 38%,
    #fff9e0 0%,
    var(--gold) 12%,
    var(--core) 35%,
    #7a2000 65%,
    #1a0800 85%,
    var(--bg) 100%
  );
  box-shadow:
    0 0 40px var(--glow-a),
    0 0 100px #ff6b0055,
    0 0 200px #ff450022,
    inset 0 0 30px #00000088;
  animation: pulse 3.5s ease-in-out infinite;
  position: relative;
  z-index: 2;
}

@keyframes pulse {
  0%,100% {
    box-shadow: 0 0 40px var(--glow-a), 0 0 100px #ff6b0055, 0 0 200px #ff450022, inset 0 0 30px #00000088;
    transform: scale(1);
  }
  50% {
    box-shadow: 0 0 70px var(--glow-a), 0 0 150px #ff6b0077, 0 0 300px #ff450033, inset 0 0 30px #00000088;
    transform: scale(1.04);
  }
}

/* energy particles */
.particles {
  position: absolute;
  inset: 0;
  pointer-events: none;
}
.particle {
  position: absolute;
  width: 2px; height: 2px;
  border-radius: 50%;
  background: var(--gold);
  opacity: 0;
  animation: orbit var(--dur, 4s) linear infinite;
  animation-delay: var(--del, 0s);
  top: 50%; left: 50%;
  transform-origin: 0 0;
}
@keyframes orbit {
  0%   { opacity: 0; transform: rotate(var(--from)) translateX(var(--r)) scale(0); }
  10%  { opacity: 1; transform: rotate(calc(var(--from) + 36deg)) translateX(var(--r)) scale(1); }
  90%  { opacity: 1; }
  100% { opacity: 0; transform: rotate(calc(var(--from) + 360deg)) translateX(var(--r)) scale(0); }
}

/* audio waveform bars under core */
.waveform {
  position: absolute;
  bottom: -40px;
  display: flex;
  gap: 3px;
  align-items: flex-end;
  height: 30px;
}
.wave-bar {
  width: 4px;
  border-radius: 2px;
  background: var(--core);
  opacity: 0.6;
  transform-origin: bottom;
  animation: wave var(--spd, 0.8s) ease-in-out infinite alternate;
  animation-delay: var(--del, 0s);
  height: 4px;
  transition: height 0.1s;
}
.wave-bar.active { opacity: 1; }
@keyframes wave {
  to { transform: scaleY(var(--h, 5)); }
}

/* ─── Chat panel ─────────────────────────── */
#chat-panel {
  grid-area: chat;
  display: flex;
  flex-direction: column;
  border-left: 1px solid var(--border);
  background: var(--panel);
  backdrop-filter: blur(10px);
  overflow: hidden;
}
.chat-header {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  font-family: 'Orbitron', sans-serif;
  font-size: 0.65rem;
  letter-spacing: 0.25em;
  color: var(--txt-muted);
  flex-shrink: 0;
}
.chat-messages {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  scroll-behavior: smooth;
}
.chat-messages::-webkit-scrollbar { width: 3px; }
.chat-messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.msg {
  max-width: 90%;
  padding: 10px 14px;
  border-radius: 4px;
  font-size: 0.88rem;
  font-weight: 400;
  line-height: 1.5;
  animation: msgIn 0.3s ease;
}
@keyframes msgIn { from { opacity: 0; transform: translateY(8px); } }
.msg.user {
  background: var(--user-msg);
  border: 1px solid #2a2a4a;
  border-radius: 4px 4px 0 4px;
  align-self: flex-end;
  color: var(--txt);
}
.msg.jarvis {
  background: var(--jarvis-msg);
  border: 1px solid #0a2a0a;
  border-radius: 4px 4px 4px 0;
  align-self: flex-start;
  color: #c0e8c0;
}
.msg .label {
  font-size: 0.65rem;
  letter-spacing: 0.15em;
  opacity: 0.5;
  margin-bottom: 4px;
  font-family: 'Orbitron', sans-serif;
  font-weight: 700;
}
.msg.jarvis .label { color: var(--accent-g); }
.msg.user .label { color: var(--core); }

.chat-hint {
  text-align: center;
  color: var(--txt-muted);
  font-size: 0.78rem;
  padding: 24px 16px;
  line-height: 1.6;
}
.chat-hint span { color: var(--core); }

/* ─── Controls bar ───────────────────────── */
.controls {
  grid-area: controls;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 24px;
  padding: 16px 24px;
  border-top: 1px solid var(--border);
  background: var(--surface);
}

.btn-voice {
  position: relative;
  width: 56px; height: 56px;
  border-radius: 50%;
  border: 2px solid var(--core);
  background: transparent;
  cursor: pointer;
  color: var(--core);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.3s, box-shadow 0.3s, transform 0.2s;
  font-size: 22px;
}
.btn-voice:hover { background: #ff8c0022; box-shadow: 0 0 20px var(--glow-a); }
.btn-voice:active { transform: scale(0.95); }
.btn-voice.active {
  background: var(--core);
  color: var(--bg);
  box-shadow: 0 0 30px var(--glow-a), 0 0 60px var(--glow-a);
  animation: ringPulse 1.5s ease-in-out infinite;
}
@keyframes ringPulse {
  0%,100% { box-shadow: 0 0 20px var(--glow-a), 0 0 40px var(--glow-a); }
  50% { box-shadow: 0 0 40px var(--glow-a), 0 0 80px var(--glow-a); }
}

.btn-voice-label {
  font-family: 'Orbitron', sans-serif;
  font-size: 0.6rem;
  letter-spacing: 0.15em;
  color: var(--txt-muted);
  text-align: center;
  line-height: 1;
}

.voice-group {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
}

/* config warning */
.config-warning {
  position: fixed;
  top: 60px;
  left: 50%;
  transform: translateX(-50%);
  background: #2a0a00;
  border: 1px solid var(--core);
  color: var(--amber);
  padding: 10px 20px;
  border-radius: 4px;
  font-size: 0.82rem;
  font-weight: 600;
  z-index: 100;
  animation: slideDown 0.3s ease;
  max-width: calc(100vw - 32px);
  text-align: center;
  display: none;
}
.config-warning.show { display: block; }
@keyframes slideDown { from { opacity:0; transform: translateX(-50%) translateY(-8px); } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; }
}
</style>
</head>
<body>
<div class="shell">

  <!-- Top bar -->
  <header class="topbar">
    <div class="topbar-title">J.A.R.V.I.S</div>
    <div class="topbar-right">
      <div class="status-dot" id="status-dot"></div>
      <span id="status-label">BEREIT</span>
      <span id="clock">--:--:--</span>
    </div>
  </header>

  <!-- Stage -->
  <main class="stage">
    <div class="orb-system" id="orb-system">
      <div class="ring ring-outer"></div>
      <div class="ring ring-mid"></div>
      <div class="ring ring-inner"></div>
      <div class="orb-core"></div>
      <div class="particles" id="particles"></div>
      <div class="waveform" id="waveform">
        <!-- bars injected by JS -->
      </div>
    </div>
  </main>

  <!-- Chat panel -->
  <aside id="chat-panel">
    <div class="chat-header">GESPRÄCHSPROTOKOLL</div>
    <div class="chat-messages" id="chat-messages">
      <div class="chat-hint">
        Drücke <span>&#9675;</span> um das Gespräch zu starten.<br>
        JARVIS hört dir auf Deutsch zu.
      </div>
    </div>
  </aside>

  <!-- Controls -->
  <footer class="controls">
    <div class="voice-group">
      <button class="btn-voice" id="btn-voice" title="Gespräch starten / beenden" aria-label="Gespräch starten">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
          <line x1="12" y1="19" x2="12" y2="23"/>
          <line x1="8" y1="23" x2="16" y2="23"/>
        </svg>
      </button>
      <span class="btn-voice-label" id="voice-label">STARTEN</span>
    </div>
  </footer>
</div>

<div class="config-warning" id="config-warning"></div>

<script>
// ─── Clock ──────────────────────────────────────────────────────────────────
function updateClock() {
  document.getElementById('clock').textContent =
    new Date().toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
}
updateClock();
setInterval(updateClock, 1000);

// ─── Particles ──────────────────────────────────────────────────────────────
(function spawnParticles() {
  const el = document.getElementById('particles');
  const count = 14;
  for (let i = 0; i < count; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    const r = 38 + Math.random() * 30;
    p.style.setProperty('--r', r + '%');
    p.style.setProperty('--from', (i * (360 / count)) + 'deg');
    p.style.setProperty('--dur', (3 + Math.random() * 3) + 's');
    p.style.setProperty('--del', (-Math.random() * 6) + 's');
    p.style.background = Math.random() > 0.5 ? 'var(--gold)' : 'var(--core)';
    el.appendChild(p);
  }
})();

// ─── Waveform bars ─────────────────────────────────────────────────────────
const waveEl = document.getElementById('waveform');
const barCount = 18;
const bars = [];
for (let i = 0; i < barCount; i++) {
  const b = document.createElement('div');
  b.className = 'wave-bar';
  const spd = (0.5 + Math.random() * 0.8).toFixed(2);
  const h   = (2 + Math.random() * 6).toFixed(1);
  const del = (-Math.random() * 1).toFixed(2);
  b.style.setProperty('--spd', spd + 's');
  b.style.setProperty('--h', h);
  b.style.setProperty('--del', del + 's');
  waveEl.appendChild(b);
  bars.push(b);
}

function setWaveActive(active) {
  bars.forEach(b => b.classList.toggle('active', active));
}

// ─── Status helpers ─────────────────────────────────────────────────────────
const dot   = document.getElementById('status-dot');
const label = document.getElementById('status-label');

function setStatus(state, text) {
  dot.className = 'status-dot ' + (state || '');
  label.textContent = text;
}

// ─── Chat helpers ───────────────────────────────────────────────────────────
const chatEl = document.getElementById('chat-messages');
let firstMessage = true;

function addMessage(role, text) {
  if (firstMessage) { chatEl.innerHTML = ''; firstMessage = false; }
  const msg = document.createElement('div');
  msg.className = 'msg ' + role;
  const lbl = document.createElement('div');
  lbl.className = 'label';
  lbl.textContent = role === 'user' ? 'DU' : 'JARVIS';
  msg.appendChild(lbl);
  msg.appendChild(document.createTextNode(text));
  chatEl.appendChild(msg);
  chatEl.scrollTop = chatEl.scrollHeight;
}

// ─── Warning banner ──────────────────────────────────────────────────────────
function showWarning(msg, autohide = 6000) {
  const el = document.getElementById('config-warning');
  el.textContent = msg;
  el.classList.add('show');
  if (autohide) setTimeout(() => el.classList.remove('show'), autohide);
}

// ─── Audio plumbing ──────────────────────────────────────────────────────────
let audioCtx = null;
let nextPlayAt = 0;

function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

async function scheduleAudio(b64) {
  const ctx = getAudioCtx();
  try {
    const raw = atob(b64);
    const buf = new Uint8Array(raw.length);
    for (let i = 0; i < raw.length; i++) buf[i] = raw.charCodeAt(i);
    const decoded = await ctx.decodeAudioData(buf.buffer.slice(0));
    const src = ctx.createBufferSource();
    src.buffer = decoded;
    src.connect(ctx.destination);
    const when = Math.max(ctx.currentTime, nextPlayAt);
    src.start(when);
    nextPlayAt = when + decoded.duration;
  } catch (e) {
    // fallback: blob audio
    const raw = atob(b64);
    const bytes = new Uint8Array(raw.length);
    for (let i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);
    const blob = new Blob([bytes], { type: 'audio/mpeg' });
    const url = URL.createObjectURL(blob);
    const a = new Audio(url);
    a.onended = () => URL.revokeObjectURL(url);
    a.play().catch(() => {});
  }
}

// ─── Mic → PCM 16kHz ─────────────────────────────────────────────────────────
let micStream = null;
let scriptProcessor = null;
let micAudioCtx = null;

async function startMic(onChunk) {
  micStream = await navigator.mediaDevices.getUserMedia({ audio: {
    sampleRate: 16000, channelCount: 1, echoCancellation: true, noiseSuppression: true
  }});
  micAudioCtx = new AudioContext({ sampleRate: 16000 });
  const src = micAudioCtx.createMediaStreamSource(micStream);
  scriptProcessor = micAudioCtx.createScriptProcessor(4096, 1, 1);
  scriptProcessor.onaudioprocess = (e) => {
    const f32 = e.inputBuffer.getChannelData(0);
    const i16 = new Int16Array(f32.length);
    for (let i = 0; i < f32.length; i++) {
      const s = Math.max(-1, Math.min(1, f32[i]));
      i16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
    }
    onChunk(i16);
  };
  src.connect(scriptProcessor);
  scriptProcessor.connect(micAudioCtx.destination);
}

function stopMic() {
  if (scriptProcessor) { scriptProcessor.disconnect(); scriptProcessor = null; }
  if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
  if (micAudioCtx) { micAudioCtx.close(); micAudioCtx = null; }
}

// ─── ElevenLabs WebSocket ────────────────────────────────────────────────────
let ws = null;
let sessionActive = false;

async function startConversation() {
  setStatus('thinking', 'VERBINDE...');

  let signedUrl;
  try {
    const resp = await fetch('/signed-url');
    const data = await resp.json();
    if (data.error) { showWarning('⚠ ' + data.error, 0); setStatus('', 'BEREIT'); return; }
    signedUrl = data.signed_url;
  } catch (e) {
    showWarning('⚠ Server nicht erreichbar. Läuft jarvis_server.py?', 0);
    setStatus('', 'BEREIT');
    return;
  }

  ws = new WebSocket(signedUrl);

  ws.onopen = async () => {
    // request German language
    ws.send(JSON.stringify({
      type: 'conversation_initiation_client_data',
      conversation_config_override: {
        agent: { language: 'de' }
      }
    }));

    try {
      await startMic((i16) => {
        if (!ws || ws.readyState !== WebSocket.OPEN) return;
        const raw = String.fromCharCode(...new Uint8Array(i16.buffer));
        ws.send(JSON.stringify({ user_audio_chunk: btoa(raw) }));
      });
    } catch (err) {
      showWarning('⚠ Mikrofon-Zugriff verweigert: ' + err.message);
      stopConversation();
      return;
    }

    sessionActive = true;
    setStatus('active', 'HÖRT ZU');
    setWaveActive(true);
  };

  ws.onmessage = (ev) => {
    let msg;
    try { msg = JSON.parse(ev.data); } catch { return; }

    switch (msg.type) {
      case 'audio':
        setStatus('speaking', 'SPRICHT');
        scheduleAudio(msg.audio_event.audio_base_64);
        break;
      case 'agent_response':
        addMessage('jarvis', msg.agent_response_event.agent_response);
        break;
      case 'user_transcript':
        const t = msg.user_transcription_event.user_transcript;
        if (t && t.trim()) addMessage('user', t);
        setStatus('active', 'HÖRT ZU');
        break;
      case 'interruption':
        nextPlayAt = 0;
        setStatus('active', 'HÖRT ZU');
        break;
      case 'ping':
        ws.send(JSON.stringify({ type: 'pong', event_id: msg.ping_event?.event_id }));
        break;
    }
  };

  ws.onclose = () => { if (sessionActive) stopConversation(); };
  ws.onerror = () => { showWarning('⚠ Verbindungsfehler.'); stopConversation(); };
}

function stopConversation() {
  sessionActive = false;
  stopMic();
  if (ws) { ws.close(); ws = null; }
  nextPlayAt = 0;
  setWaveActive(false);
  setStatus('', 'BEREIT');
  document.getElementById('btn-voice').classList.remove('active');
  document.getElementById('voice-label').textContent = 'STARTEN';
}

// ─── Button ──────────────────────────────────────────────────────────────────
document.getElementById('btn-voice').addEventListener('click', async () => {
  if (sessionActive) {
    stopConversation();
  } else {
    document.getElementById('btn-voice').classList.add('active');
    document.getElementById('voice-label').textContent = 'BEENDEN';
    await startConversation();
  }
});

// ─── Check config on load ────────────────────────────────────────────────────
fetch('/config').then(r => r.json()).then(d => {
  if (!d.configured) {
    showWarning('⚠ ELEVENLABS_API_KEY und ELEVENLABS_AGENT_ID nicht gesetzt — Demo-Modus.', 0);
  }
}).catch(() => {});
</script>
</body>
</html>
